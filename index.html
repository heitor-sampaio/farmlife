<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>FarmLife 3D — Simulador de Fazenda</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <header class="hud">
    <div class="pill brand">🌻 <span>FarmLife</span></div>
    <div class="pill coins" title="Moedas">🪙 <b id="coins">0</b></div>
    <div class="pill level" title="Nível e experiência">
      <span>Nv <b id="level">1</b></span>
      <div class="xpbar"><i id="xpfill"></i></div>
      <small id="xptext">0/50</small>
    </div>
    <div class="pill clock" title="Dia e hora na fazenda">
      <span id="weather">☀️</span> <b id="day">Dia 1</b> <span id="clock">06:00</span>
    </div>
    <div class="pill event-pill" id="event-pill" hidden>
      <b id="event-name"></b><small id="event-info"></small>
    </div>
    <div class="spacer"></div>
    <nav class="hud-menu">
      <button class="menu-btn" data-open="loja" title="Loja">🏪<span>Loja</span></button>
      <button class="menu-btn" data-open="celeiro" title="Celeiro">🛖<span>Celeiro</span></button>
      <button class="menu-btn" data-open="pedidos" title="Pedidos">📦<span>Pedidos</span><b id="badge" class="badge" hidden>0</b></button>
      <button class="menu-btn" data-open="oficina" title="Oficina: carpintaria e obras">🪚<span>Oficina</span></button>
    </nav>
    <div class="hud-btns">
      <button class="icon-btn" id="btn-sound" title="Som ligado/desligado">🔊</button>
      <button class="icon-btn" id="btn-help" title="Guia da Fazenda">❓</button>
      <button class="icon-btn" id="btn-reset" title="Recomeçar fazenda">🔄</button>
    </div>
  </header>

  <div class="bottom">
    <div id="prompt" class="prompt" hidden></div>
    <div id="status" class="status"></div>
    <div id="toolbar" class="toolbar"></div>
  </div>

  <div class="side-ctrl">
    <button class="icon-btn dark" id="zoom-in" title="Aproximar (+)">＋</button>
    <button class="icon-btn dark" id="zoom-out" title="Afastar (−)">－</button>
  </div>
  <button id="btn-action" class="action-btn" title="Ação (Espaço)">✋</button>

  <aside id="panel" class="panel">
    <nav class="tabs">
      <button class="tab active" data-tab="loja">🏪 Loja</button>
      <button class="tab" data-tab="celeiro">🛖 Celeiro</button>
      <button class="tab" data-tab="pedidos">📦 Pedidos</button>
      <button class="tab" data-tab="oficina">🪚 Oficina</button>
      <button class="tab-close" id="btn-close" title="Fechar (Esc)">✕</button>
    </nav>
    <div id="tab-content" class="tab-content"></div>
  </aside>

  <div id="fishgame" class="fishgame" hidden>
    <div class="fish-title">🎣 Puxe!</div>
    <div class="fish-body">
      <div class="fish-track">
        <div id="fish-zone" class="fish-zone"></div>
        <div id="fish-icon" class="fish-icon">🐟</div>
      </div>
      <div class="fish-meter"><i id="fish-progress"></i></div>
    </div>
    <small>Segure <kbd>Espaço</kbd> ou ✋ para subir</small>
  </div>

  <div id="fx" class="fx-layer"></div>
  <div id="toasts" class="toasts"></div>
  <div id="fade" class="fade"></div>

  <!-- Tutorial interativo e dicas -->
  <section id="tut" class="tut" hidden>
    <div class="tut-head">
      <span id="tut-step" class="tut-step">Tutorial</span>
      <button id="tut-min" class="tut-min" title="Minimizar">–</button>
    </div>
    <div class="tut-title"><span id="tut-icon">🌻</span><b id="tut-title"></b></div>
    <div id="tut-body" class="tut-body"></div>
    <div id="tut-progress" class="tut-progress" hidden><i></i><span></span></div>
    <div class="tut-foot">
      <button id="tut-skip" class="tut-link">Pular tutorial</button>
      <span class="tut-btns">
        <button id="tut-guide" class="btn ghost" hidden>📖 Abrir o Guia</button>
        <button id="tut-next" class="btn">Começar ▶</button>
      </span>
    </div>
  </section>
  <div id="guide-edge" class="guide-edge" hidden>➜</div>

  <!-- Aviso de versão nova -->
  <div id="update-bar" class="update-bar" hidden>
    <span id="update-text"></span>
    <span class="update-btns">
      <button id="update-later" class="tut-link">Depois</button>
      <button id="update-now" class="btn">🔄 Atualizar agora</button>
    </span>
  </div>

  <!-- Guia da Fazenda -->
  <div id="modal" class="modal-bg" hidden>
    <div class="modal guide" role="dialog" aria-labelledby="guide-title">
      <header class="guide-head">
        <h2 id="guide-title">📖 Guia da Fazenda <small id="guide-version" class="guide-version"></small></h2>
        <button id="guide-close" class="tab-close" title="Fechar (Esc)">✕</button>
      </header>
      <div class="guide-wrap">
        <nav id="guide-nav" class="guide-nav"></nav>
        <div id="guide-content" class="guide-content"></div>
      </div>
    </div>
  </div>

  <div id="loading" class="loading">
    <div class="loading-box">
      <div class="loading-icon">🌻</div>
      <p id="loading-msg">Preparando a fazenda…</p>
    </div>
  </div>
  <script>
    // Se o módulo 3D não carregar (sem internet ou aberto direto como arquivo), explica o motivo
    setTimeout(function () {
      var msg = document.getElementById('loading-msg');
      if (!msg) return;
      msg.innerHTML = location.protocol === 'file:'
        ? 'Abra o jogo pelo servidor local: rode <code>node serve.js</code> e acesse <b>http://localhost:5173</b>.'
        : 'Não foi possível carregar o motor 3D (Three.js). Verifique sua conexão com a internet e recarregue a página.';
    }, location.protocol === 'file:' ? 300 : 12000);
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
